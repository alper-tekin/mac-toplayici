name: Gecmis
# Elle başlatılır: eski sezonların fikstürü ve maç sayfaları veri deposunun gecmis-veri dalına.
# Her tur ~45 dk çalışır, bitmediyse bir sonraki turu kendisi başlatır; iş bitince ya da üst üste hata
# olursa zincir durur. Durdurmak için Actions'ta workflow'u devre dışı bırak.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write           # bir sonraki turu başlatmak için

concurrency:
  group: gecmis
  cancel-in-progress: false

jobs:
  tur:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERI_TOKEN: ${{ secrets.VERI_TOKEN }}
      VERI_REPO: ${{ secrets.VERI_REPO }}
      VERI_DAL: gecmis-veri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: kod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Bağımlılık
        run: python -m pip install --quiet curl-cffi==0.16.3
      - name: Veri dalını al
        run: |
          AUTH=$(printf 'x-access-token:%s' "$VERI_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          URL="https://github.com/$VERI_REPO.git"
          if git -c http.extraheader="AUTHORIZATION: basic $AUTH" ls-remote --exit-code --heads "$URL" "$VERI_DAL" >/dev/null; then
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" clone --quiet --depth 1 --branch "$VERI_DAL" "$URL" veri
          else
            git init --quiet veri
            git -C veri checkout --quiet --orphan "$VERI_DAL"
            git -C veri remote add origin "$URL"
            echo "yeni dal"
          fi
          git -C veri config http.extraheader "AUTHORIZATION: basic $AUTH"
      - name: Tur
        working-directory: kod
        run: python gecmis.py --veri ../veri --butce-dk 45 --durum-cikti ../tur_durum.txt
      - name: Veriyi gönder
        working-directory: veri
        run: |
          git config user.name toplayici
          git config user.email toplayici@users.noreply.github.com
          git add gecmis
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit --quiet -m "Geçmiş $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push --quiet origin "HEAD:$VERI_DAL" && { echo "gönderildi"; exit 0; }
            sleep 20
          done
          echo "gönderilemedi"; exit 1
      - name: Sonraki tur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat tur_durum.txt
          if grep -q '^bitti=1' tur_durum.txt; then echo "iş bitti, zincir duruyor"; exit 0; fi
          if grep -q '^durdu_hata=1' tur_durum.txt; then echo "üst üste hata, zincir duruyor"; exit 0; fi
          curl -sS -f -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/gecmis.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "sonraki tur istendi"
